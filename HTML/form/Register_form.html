<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: pink; margin: 0; padding: 0; box-sizing: border-box;">
    <h1 align="center">Student Registration Form</h1>
    <form action="" method="get">
        <fieldset>
        <label for="roll"> Roll no : 
            <input type="text" name="roll" id="roll">
        </label> <br> <br>
        <label for="name">Student name : 
            <input type="text" placeholder="Frist Name"> - <input type="text" placeholder="Last Name">
        </label> <br> <br>
        <label for="father"> Father's name :
            <input type="text">
        </label> <br> <br>
        <label for="date">Date of Birth : 
            <input type="date" placeholder="Day">
        </label> <br> <br>
        <label for="mobile"> Mobile No : +885 -
            <input type="tel">
        </label> <br> <br>
        <label for="">Email id : 
            <input type="email">
        </label> <br> <br>
        <label for="">Password : 
            <input type="password">
        </label> <br> <br>
        <label for=""> Gender : 
            <input type="radio"> Male <input type="radio"> Female
        </label> <br> <br>
        <label for="">Department : 
            <input type="checkbox"> IT <input type="checkbox" > ITE <input type="checkbox"> CS
        </label> <br> <br>
        <label for="course">Course :
            <select name="course" id="course">
                <option value="---">------------- Select Course Pls----------------</option>
                <option value="HTML">HTML</option>
                <option value="CSS">CSS</option>
                <option value="Javascript">javascript</option>
                <option value="Rest.js">Rest.js</option>
            </select> 
        </label> <br> <br>

        <label for="">Student Photo : 
            <input type="file">
        </label> <br> <br>
        <label for="">Address 
            <textarea name="" id=""></textarea>
        </label>
    </fieldset>
    </form>
</body>
</html>
